<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f0442e">
  <title>Informasi Pembatalan SPinjam</title>
  <style>
    :root {
      color-scheme: light;
      --orange: #f0442e;
      --orange-dark: #e83d29;
      --ink: #263244;
      --muted: #5b6472;
      --cream: #fff0d9;
      --line: #edf0f3;
      --page-width:  min(100% - 2 * clamp(1rem, 5vw, 2.5rem), 70rem);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-text-size-adjust: 100%;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { min-width: 320px; scroll-behavior: smooth; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: #fff;
      color: var(--ink);
      overflow-wrap: break-word;
    }
    a, button { -webkit-tap-highlight-color: transparent; }
    a:focus-visible, button:focus-visible {
      outline: 3px solid #263244;
      outline-offset: 4px;
    }

    .topbar {
      width: 100%;
      min-height: clamp(76px, 10vw, 112px);
      padding: 1rem max(clamp(1rem, 5vw, 2.5rem), calc((100% - 70rem) / 2));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: clamp(.75rem, 3vw, 1.5rem);
      border-bottom: 1px solid #f5e8dc;
    }
    .brand {
      min-width: 0;
      font-size: clamp(1.35rem, 3.7vw, 2.375rem);
      font-weight: 850;
      letter-spacing: clamp(-1.8px, -.12vw, -0.6px);
      line-height: 1.1;
    }
    .brand-lockup { display: flex; align-items: center; gap: clamp(.55rem, 1.5vw, .9rem); min-width: 0; }
    .brand-mark { width: clamp(2.25rem, 5vw, 3.25rem); height: clamp(2.25rem, 5vw, 3.25rem); flex: 0 0 auto; color: var(--orange); }
    .brand-copy { min-width: 0; }
    .brand { font-size: clamp(1.35rem, 3.7vw, 2.375rem); font-weight: 850; letter-spacing: clamp(-1.8px, -.12vw, -0.6px); line-height: 1.1; }
    .brand .accent { color: var(--orange); }
    .brand .dark { color: #202d40; }
    .brand-note { display: block; margin-top: .2rem; color: #6b7280; font-size: clamp(.62rem, 1vw, .75rem); font-weight: 600; letter-spacing: .02em; }

    .top-contact, .primary, .secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .55rem;
      max-width: 100%;
      text-align: center;
      text-decoration: none;
      border-radius: clamp(.85rem, 2vw, 1.125rem);
      font-family: inherit;
      font-weight: 750;
      line-height: 1.3;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease, background-color .18s ease;
    }
    .top-contact {
      flex: 0 0 auto;
      padding: clamp(.7rem, 1.5vw, 1rem) clamp(.9rem, 2.4vw, 1.75rem);
      background: var(--orange);
      color: #fff;
      font-size: clamp(.85rem, 1.6vw, 1rem);
      box-shadow: 0 10px 20px #f0442e24;
    }
    .top-contact:hover, .primary:hover, .secondary:hover { transform: translateY(-2px); }

    main {
      width: var(--page-width);
      margin-inline: auto;
      padding-block: clamp(3.25rem, 9vw, 7rem) clamp(4rem, 10vw, 6.25rem);
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: .7rem;
      max-width: 100%;
      padding: .7rem clamp(.85rem, 2vw, 1.25rem);
      border-radius: 999px;
      background: var(--cream);
      color: #e65a43;
      font-size: clamp(.72rem, 1.5vw, .94rem);
      font-weight: 800;
      letter-spacing: clamp(.4px, .12vw, 1.1px);
      line-height: 1.35;
    }
    .status-icon { width: 14px; height: 14px; flex: 0 0 14px; display: block; color: #16a34a; }
    .button-icon { width: clamp(1.25rem, 2.4vw, 1.7rem); height: clamp(1.25rem, 2.4vw, 1.7rem); flex: 0 0 auto; display: block; }
    .close-icon { width: 1.35rem; height: 1.35rem; display: block; }
    .secondary-icon { width: clamp(1.2rem, 2.3vw, 1.55rem); height: clamp(1.2rem, 2.3vw, 1.55rem); flex: 0 0 auto; display: block; }

    h1 {
      max-width: 12ch;
      margin: clamp(2.5rem, 6vw, 3.5rem) 0 clamp(1rem, 2.5vw, 1.5rem);
      color: var(--orange);
      font-size: clamp(2.65rem, 8.2vw, 5.5rem);
      line-height: 1.04;
      letter-spacing: clamp(-3px, -.2vw, -1px);
    }
    .intro {
      max-width: 52rem;
      margin: 0;
      color: var(--muted);
      font-size: clamp(1.05rem, 2.55vw, 1.7rem);
      line-height: 1.62;
    }
    .actions {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: clamp(.8rem, 2vw, 1.125rem);
      width: min(100%, 40.625rem);
      margin-top: clamp(2.75rem, 7vw, 4.125rem);
    }
    .primary {
      min-height: clamp(4.25rem, 8vw, 6rem);
      padding: clamp(1rem, 2.6vw, 1.5rem);
      background: var(--orange);
      color: #fff;
      font-size: clamp(1rem, 2.55vw, 1.75rem);
      box-shadow: 0 18px 28px #f0442e2b;
    }
    .secondary {
      min-height: clamp(3.75rem, 7vw, 5.125rem);
      padding: clamp(.9rem, 2.2vw, 1.25rem);
      border: 2px solid var(--line);
      color: var(--ink);
      background: #fff;
      font-size: clamp(1rem, 2.1vw, 1.375rem);
    }
    .disclaimer {
      max-width: 48rem;
      margin: clamp(2rem, 5vw, 3rem) 0 0;
      color: #87909c;
      font-size: clamp(.75rem, 1.3vw, .875rem);
      line-height: 1.65;
    }

    .chat-panel {
      position: fixed;
      right: max(1rem, env(safe-area-inset-right));
      bottom: max(1rem, env(safe-area-inset-bottom));
      width: min(23rem, calc(100vw - 2rem));
      max-height: min(75dvh, 32rem);
      overflow: auto;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 1.125rem;
      box-shadow: 0 18px 55px #17203325;
      padding: clamp(1rem, 3vw, 1.25rem);
      display: none;
      z-index: 5;
    }
    .chat-panel.open { display: block; }
    .chat-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: .75rem; }
    .chat-head strong { font-size: 1.125rem; }
    .close { border: 0; background: transparent; padding: .35rem; cursor: pointer; color: var(--muted); }
    .chat-panel p { color: var(--muted); line-height: 1.55; }
    .chat-panel a { color: var(--orange-dark); font-weight: 700; }

    @media (min-width: 900px) {
      .actions { grid-template-columns: 1fr; }
    }
    @media (max-width: 480px) {
      .topbar { padding-inline: 1rem; gap: .5rem; }
      .brand { font-size: clamp(1.15rem, 5.5vw, 1.55rem); letter-spacing: -.8px; }
      .brand-mark { width: 2.1rem; height: 2.1rem; }
      .brand-note { font-size: .6rem; }
      .top-contact { padding: .7rem .85rem; border-radius: .85rem; font-size: .8rem; }
      main { padding-top: 3.25rem; }
      .status { gap: .5rem; padding: .62rem .85rem; }
      h1 { margin-top: 2.5rem; }
      .primary { padding-inline: .8rem; }
    }
    @media (max-width: 360px) {
      .topbar { align-items: flex-start; flex-direction: column; }
      .top-contact { align-self: flex-start; }
      .status { font-size: .68rem; }
      .primary { font-size: .98rem; }
    }
    @media (min-width: 1200px) {
      main { padding-top: 7rem; }
    }
    @media (orientation: landscape) and (max-height: 520px) {
      main { padding-block: 2rem 3rem; }
      h1 { margin-top: 1.5rem; }
      .actions { margin-top: 2rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand-lockup" aria-label="Info SPinjam, situs independen">
      <svg class="brand-mark" viewBox="0 0 48 48" role="img" aria-label="Ikon tas belanja">
        <path d="M9 17.5h30l-2.2 25H11.2L9 17.5Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
        <path d="M17 19v-5a7 7 0 0 1 14 0v5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        <path d="M19 28c1.2-2 8.8-2.3 10 .2 1.3 2.2-1.3 3.6-5 4.2-3.6.6-5.8 2.2-4.2 4.1 1.6 1.9 7.1 1.8 9.4-.1" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      <div class="brand-copy">
        <div class="brand"><span class="accent">Info</span> <span class="dark">SPinjam</span></div>
        <span class="brand-note">Layanan SPinjam Shopee</span>
      </div>
    </div>
    <a class="top-contact" href="#kontak" id="topContact">Hubungi CS</a>
  </header>

  <main>
    <div class="status"><svg class="status-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="7" fill="currentColor"/></svg> LAYANAN INFORMASI ONLINE</div>
    <h1>Pembatalan<br>SPinjam</h1>
    <p class="intro">
      Mengalami kendala atau ingin membatalkan pengajuan SPinjam?
      Pelajari prosesnya melalui kanal bantuan resmi penyedia layanan.
    </p>

    <div class="actions" id="kontak">
      <a class="primary" id="whatsappLink" href="#" target="_blank" rel="noopener">
        <svg class="button-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20.2 11.6a8.2 8.2 0 0 1-12.1 7.2L3 20l1.2-4.8A8.2 8.2 0 1 1 20.2 11.6Z"/><path d="M8.2 8.2c.3-.5.6-.5.9-.5h.5c.2 0 .4.1.5.4l.7 1.6c.1.2.1.4-.1.6l-.5.6c-.2.2-.2.4 0 .7.5.8 1.2 1.5 2 2 .3.2.5.2.7 0l.7-.8c.2-.2.4-.2.7-.1l1.5.7c.3.1.4.3.4.5 0 .3-.1 1-.6 1.4-.5.5-1.2.7-1.9.6-1.1-.2-2.5-.9-3.8-2.1-1.3-1.2-2.1-2.7-2.3-3.8-.1-.7.1-1.3.6-1.8Z"/></svg>&nbsp; Hubungi melalui WhatsApp
      </a>
      <button class="secondary" id="liveChatButton" type="button"><svg class="secondary-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 13v-2a8 8 0 0 1 16 0v2"/><path d="M4 13a2 2 0 0 0 2 2h1v-5H6a2 2 0 0 0-2 2Zm16 0a2 2 0 0 1-2 2h-1v-5h1a2 2 0 0 1 2 2Z"/><path d="M17 17a5 5 0 0 1-5 3h-1"/></svg>&nbsp; Live Chat Informasi</button>
    </div>
  </main>

  <section class="chat-panel" id="chatPanel" aria-live="polite">
    <div class="chat-head">
      <strong>Informasi bantuan</strong>
      <button class="close" id="closeChat" aria-label="Tutup"><svg class="close-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="m18 6-12 12M6 6l12 12"/></svg></button>
    </div>
    <a href="https://help.shopee.co.id/portal" target="_blank" rel="noopener">Pusat Bantuan Shopee</a>
  </section>

  <script>
    // Ganti dengan nomor WhatsApp bisnis Anda dalam format internasional tanpa tanda +.
    // Contoh format: 62812XXXXXXXX
    const WHATSAPP_NUMBER = "6285977581983";
    const WHATSAPP_MESSAGE = "Halo, saya ingin bertanya mengenai informasi pembatalan pengajuan SPinjam.";
    const waLink = document.getElementById("whatsappLink");
    waLink.href = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(WHATSAPP_MESSAGE);

    const panel = document.getElementById("chatPanel");
    document.getElementById("liveChatButton").addEventListener("click", () => panel.classList.add("open"));
    document.getElementById("closeChat").addEventListener("click", () => panel.classList.remove("open"));
    document.getElementById("topContact").addEventListener("click", (event) => {
      event.preventDefault();
      document.getElementById("kontak").scrollIntoView({ behavior: "smooth" });
    });
  </script>
</body>
</html>
