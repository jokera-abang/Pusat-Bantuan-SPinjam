<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pusat Bantuan SPinjam</title>

  <style>
    :root {
      --orange: #ed5100;
      --button-orange: #ff5b00;
      --navy: #101a32;
      --green: #25d366;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--navy);
      font-family: Arial, Helvetica, sans-serif;
      background: #ed5100;
    }

    .site-header {
      min-height: 145px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 20px 6%;
      background:#ed5100;
    }

    .brand {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .brand-icon {
      width: 68px;
      height: 68px;
      flex: 0 0 auto;
      overflow: hidden;
      border-radius: 15px;
      background:#FFFFFF;
    }

    .brand-icon img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    .brand h1 {
      margin: 0 0 6px;
      font-size: clamp(21px, 5.8vw, 20px);
      line-height: 1.15;
    }

    .brand p {
      margin: 0;
      color: #fff;
      font-size: clamp(15px, 3.8vw, 20px);
    }

    .menu-button {
      width: 40px;
      height: 40px;
      flex: 0 0 auto;
      display: grid;
      align-content: center;
      gap: 7px;
      padding: 6px;
      border: 0;
      background: #FFFFFF;
      cursor: pointer;
    }

    .menu-button span {
      height: 3px;
      border-radius: 4px;
      background:#ed5100;
    }

    main {
      min-height: calc(100vh - 145px);
      padding: 1px 6% 60px;
      background:
        radial-gradient(ellipse at 25% 17%, rgba(207, 250, 236, .55), transparent 31%),
        radial-gradient(ellipse at 84% 83%, rgba(210, 249, 248, .62), transparent 34%),
        #fff;
    }

    .intro {
      max-width: 930px;
      margin: 0 auto;
      padding: 95px 0 70px;
      text-align: center;
    }

    .intro h2 {
      margin: 0 auto 32px;
      font-size: clamp(27px, 7vw, 36px);
      line-height: 1.4;
    }

    .intro p {
      max-width: 900px;
      margin: 0 auto;
      color: #111;
      font-size: clamp(18px, 4.8vw, 24px);
      line-height: 1.65;
    }

    .contact-card {
      width: 100%;
      max-width: 1120px;
      min-height: 205px;
      margin: 0 auto;
      padding: 28px 6%;
      background: #FFFFFF;
    }

    .contact-button {
      width: 100%;
      min-height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 10px;
      border: 0;
      border-radius: 100px;
      background: var(--button-orange);
      color: #fff;
      font: inherit;
      font-size: clamp(18px, 4.8vw, 25px);
      cursor: pointer;
    }

    .contact-button:hover {
      background: #ed5100;
    }

    .contact-button svg {
      width: 32px;
      height: 32px;
      flex: 0 0 auto;
    }

    .features {
      max-width: 900px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin: 72px auto 0;
      text-align: center;
    }

    .feature {
      padding: 18px 5px;
      color: #c8d1dc;
      font-size: 18px;
    }

    .feature svg {
      width: 38px;
      height: 38px;
      margin-bottom: 20px;
      fill: none;
      stroke-width: 2.5;
    }

    .feature:first-child svg {
      stroke: #00bd91;
    }

    .feature:last-child svg {
      stroke: #00c6d7;
    }

    .chat-widget {
      position: fixed;
      z-index: 10;
      right: 16px;
      bottom: 76px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .chat-label {
      padding: 10px 13px;
      border-radius: 20px;
      background: #fff;
      color: #263238;
      font-size: 13px;
      box-shadow: 0 3px 16px rgba(0, 0, 0, .16);
    }

    .chat-button {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 4px 16px rgba(0, 0, 0, .25);
      transition: transform .2s;
    }

    .chat-widget:hover .chat-button {
      transform: scale(1.06);
    }

    .chat-button svg {
      width: 32px;
      height: 32px;
    }

    .phone-nav {
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      background: #050505;
    }

    .phone-nav span {
      width: 24px;
      height: 24px;
      border: 4px solid #737373;
    }

    .phone-nav .square {
      border-radius: 3px;
    }

    .phone-nav .circle {
      border-radius: 50%;
    }

    .phone-nav .triangle {
      width: 0;
      height: 0;
      border: 0;
      border-top: 13px solid transparent;
      border-bottom: 13px solid transparent;
      border-right: 23px solid #737373;
    }

    @media (max-width: 360px) {
      .site-header {
        padding-inline: 4%;
      }

      .brand {
        gap: 10px;
      }

      .brand-icon {
        width: 56px;
        height: 56px;
      }

      .brand h1 {
        font-size: 19px;
      }

      .brand p {
        font-size: 13px;
      }

      .menu-button {
        width: 34px;
      }

      .chat-label {
        display: none;
      }
    }

    @media (min-width: 768px) {
      .site-header {
        min-height: 180px;
        padding: 28px max(6%, calc((100% - 1120px) / 2));
      }

      .brand {
        gap: 28px;
      }

      .brand-icon {
        width: 92px;
        height: 92px;
      }

      .brand h1 {
        font-size: 42px;
      }

      .brand p {
        font-size: 28px;
      }

      .menu-button {
        width: 52px;
        height: 52px;
        gap: 9px;
      }

      .menu-button span {
        height: 4px;
      }

      main {
        min-height: calc(100vh - 180px);
        padding-bottom: 80px;
      }

      .intro {
        padding: clamp(110px, 18vh, 185px) 0 82px;
      }

      .intro h2 {
        margin-bottom: 38px;
        font-size: 46px;
      }

      .intro p {
        font-size: 32px;
      }

      .contact-card {
        min-height: 250px;
        padding: 34px 6%;
      }

      .contact-button {
        min-height: 126px;
        gap: 22px;
        padding: 20px 30px;
        font-size: 36px;
      }

      .contact-button svg {
        width: 42px;
        height: 42px;
      }

      .features {
        gap: 28px;
        margin-top: 90px;
      }

      .feature {
        padding: 24px;
        font-size: 25px;
      }

      .feature svg {
        width: 44px;
        height: 44px;
        margin-bottom: 24px;
      }

      .chat-widget {
        right: 24px;
        bottom: 24px;
      }

      .chat-button {
        width: 64px;
        height: 64px;
      }

      .chat-button svg {
        width: 36px;
        height: 36px;
      }

      .chat-label {
        padding: 12px 16px;
        font-size: 15px;
      }

      .phone-nav {
        display: none;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="brand">
      <div class="brand-icon">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTHF7h6H3t-pebAJCWV1PdUKTrKDd2kzbF2XnL6Whr-E2JMSI7E_D-01hyS&s=10"
          alt="Logo Pusat Bantuan SPinjam"
        >
      </div>

      <div>
        <h1>Pusat Bantuan SPinjam</h1>
        <p>Layanan Informasi SPinjam</p>
      </div>
    </div>

    <button class="menu-button" type="button" aria-label="Buka menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <main>
    <section class="intro">
      <h2>Butuh bantuan informasi SPinjam sekarang?</h2>
      <p>
        Hubungi kami melalui WhatsApp untuk bertanya tentang informasi dan
        panduan SPinjam secara detail dan ramah.
      </p>
    </section>

    <section class="contact-card">
      <button class="contact-button" id="contactButton" type="button">
        <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <path d="M24 5C13.5 5 5 12.8 5 22.4c0 4.3 1.7 8.3 4.6 11.3L7 43l10.1-2.5c2.1 1 4.4 1.5 6.9 1.5 10.5 0 19-7.8 19-17.4S34.5 5 24 5Z"
                stroke="white" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M20 15c-.7-1.5-1.4-1.5-2.1-1.5-1.8 0-3.2 1.8-3.2 3.8 0 7.8 8.5 16.3 16.3 16.3 2 0 3.8-1.4 3.8-3.2 0-.7 0-1.4-1.5-2.1l-4-1.9c-.8-.4-1.3-.2-1.8.5l-1.4 1.8c-3.1-1.4-5.2-3.5-6.6-6.6l1.8-1.4c.7-.5.9-1 .5-1.8L20 15Z"
                fill="white"/>
        </svg>
        <span>Cara membatalkan SPinjam</span>
      </button>
    </section>

    <section class="features" aria-label="Informasi layanan">
      <div class="feature">
        <svg viewBox="0 0 48 48">
          <path d="M24 4 40 10v12c0 10-7 17-16 22C15 39 8 32 8 22V10l16-6Z"/>
        </svg>
        <div>Informasi Akurat</div>
      </div>

      <div class="feature">
        <svg viewBox="0 0 48 48">
          <circle cx="24" cy="24" r="19"/>
          <path d="M24 12v13l9 5"/>
        </svg>
        <div>WhatsApp</div>
      </div>
    </section>
  </main>

  <a class="chat-widget" id="whatsappChat" href="#" target="_blank"
     rel="noopener" aria-label="Chat dengan kami di WhatsApp">
    <span class="chat-label">Chat dengan kami</span>
    <span class="chat-button" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none">
        <path d="M24 5C13.5 5 5 12.8 5 22.4c0 4.3 1.7 8.3 4.6 11.3L7 43l10.1-2.5c2.1 1 4.4 1.5 6.9 1.5 10.5 0 19-7.8 19-17.4S34.5 5 24 5Z"
              stroke="white" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M20 15c-.7-1.5-1.4-1.5-2.1-1.5-1.8 0-3.2 1.8-3.2 3.8 0 7.8 8.5 16.3 16.3 16.3 2 0 3.8-1.4 3.8-3.2 0-.7 0-1.4-1.5-2.1l-4-1.9c-.8-.4-1.3-.2-1.8.5l-1.4 1.8c-3.1-1.4-5.2-3.5-6.6-6.6l1.8-1.4c.7-.5.9-1 .5-1.8L20 15Z"
              fill="white"/>
      </svg>
    </span>
  </a>

  <nav class="phone-nav" aria-hidden="true">
    <span class="square"></span>
    <span class="circle"></span>
    <span class="triangle"></span>
  </nav>

  <script>
    // Ganti dengan nomor WhatsApp tujuan (kode negara, tanpa tanda +).
    const nomorWhatsApp = "6281234567890";
    const pesan = encodeURIComponent(
      "Halo, saya ingin bertanya cara membatalkan SPinjam."
    );
    const linkWhatsApp = `https://wa.me/${nomorWhatsApp}?text=${pesan}`;

    document.getElementById("contactButton").addEventListener("click", () => {
      window.open(linkWhatsApp, "_blank", "noopener");
    });

    document.getElementById("whatsappChat").href = linkWhatsApp;
  </script>
</body>
</html>
